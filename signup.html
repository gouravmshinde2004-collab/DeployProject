<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/logo.jpg" type="image/png" sizes="16x20">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" crossorigin="anonymous" />
    <title>Sign up | 365 Entertainment</title>
</head>
<body>
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="videoplayback.webm" type="video/webm">
    </video>
    <header>
        <nav>
            <a href="index.html" class="logo"><img src="images/logo.jpg" alt="logo"></a>
            <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
            <ul id="navlinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="movies.html">Movies</a></li>
                <li><a href="tvshow.html">TV Series</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="login.html">User Login</a></li>
                <li><a href="admin-login.html">Admin Login</a></li>
                <li><a href="signup.html">Sign up</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-page">
        <div class="auth-box">
            <h1>Create account</h1>
            <p style="color:#b0b0b0; font-size:14px; margin-bottom:16px;">No account? Sign up here and you’ll be logged in automatically.</p>
            <form id="signup-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">
                <label for="confirm">Confirm password</label>
                <input type="password" id="confirm" name="confirm" placeholder="••••••••" required>
                <button type="submit">Create account</button>
            </form>
            <p class="message" id="message" role="alert"></p>
            <p class="auth-link">Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </main>

    <script>
        const form = document.getElementById('signup-form');
        const messageEl = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageEl.textContent = '';
            messageEl.className = 'message';

            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            if (password !== confirm) {
                messageEl.textContent = 'Passwords do not match';
                messageEl.className = 'message error';
                return;
            }

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();
                if (data.success) {
                    messageEl.textContent = 'Account created. Logging you in…';
                    messageEl.className = 'message success';
                    const loginRes = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const loginData = await loginRes.json();
                    if (loginData.success && loginData.user) {
                        if (loginData.user.role === 'admin') {
                            localStorage.setItem('admin', JSON.stringify(loginData.user));
                        } else {
                            localStorage.setItem('user', JSON.stringify(loginData.user));
                        }
                        messageEl.textContent = 'Welcome, ' + loginData.user.name + '! Taking you home…';
                        setTimeout(() => { window.location.href = 'index.html'; }, 1200);
                    } else {
                        messageEl.textContent = data.message + ' Go to User Login to sign in.';
                        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                    }
                } else {
                    messageEl.textContent = data.message || 'Sign up failed';
                    messageEl.className = 'message error';
                }
            } catch (err) {
                messageEl.textContent = 'Cannot reach server. Start the server with: npm start';
                messageEl.className = 'message error';
            }
        });
    </script>
</body>
</html>
